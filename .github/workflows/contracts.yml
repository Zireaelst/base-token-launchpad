name: contracts

on:
  pull_request:
    paths: ["packages/contracts/**", ".github/workflows/contracts.yml"]
  push:
    branches: [main]
    paths: ["packages/contracts/**", ".github/workflows/contracts.yml"]

jobs:
  fork-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # liquidity-launcher declares one nested submodule over SSH; fetch everything over HTTPS.
      - name: Submodules
        working-directory: .
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1

      - name: Build audited artifacts (own roots) and our code
        run: bash script/build-upstream.sh && forge build

      - name: Format
        run: forge fmt --check script test

      - name: Fork tests (Base mainnet)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "::error::BASE_RPC_URL secret is required for fork tests"; exit 1; fi
          forge test --fork-url "$BASE_RPC_URL" -vv
